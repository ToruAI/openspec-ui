name: Release

# One tag (vX.Y.Z) produces everything:
#   GitHub Release : per-platform .zip (humans), per-platform .gz (npm launcher + install.sh),
#                    install.sh, SHA256SUMS
#   npm            : `openspec-ui` launcher package (opt-in, see NPM_PUBLISH below)
#   ghcr.io        : multi-arch image ghcr.io/toruai/openspec-ui
#
# Manual run (workflow_dispatch) builds and tests everything but publishes
# nothing unless you tick "publish". Without a tag it builds the version in VERSION.
#
# One-time owner setup for npm: see "npm-publish" below.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v0.2.0). Empty = build the selected branch as v<VERSION>.'
        required: false
        default: ''
      publish:
        description: 'Actually publish (GitHub Release, npm, ghcr). Leave off for a dry run.'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/toruai/openspec-ui

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve tag and check version coherence
        id: v
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_PUBLISH: ${{ github.event.inputs.publish }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then
            tag="$REF_NAME"; publish=true
          else
            tag="${INPUT_TAG:-v$(tr -d '[:space:]' < VERSION)}"; publish="${INPUT_PUBLISH:-false}"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::'$tag' is not a vX.Y.Z tag"; exit 1; }
          version="${tag#v}"

          # VERSION == Cargo.toml == tag; npm placeholder untouched.
          scripts/check-version.sh "$tag"

          # Never rebuild over a published release: the npm package pins checksums of its assets.
          if [ "$publish" = true ] && gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Published assets are immutable (npm pins their checksums). Delete the release and tag deliberately if you really need to redo it."
            exit 1
          fi

          prerelease=false; [[ "$version" == *-* ]] && prerelease=true
          { echo "tag=$tag"; echo "version=$version"; echo "publish=$publish"; echo "prerelease=$prerelease"; } >> "$GITHUB_OUTPUT"
          echo "Building $tag (publish=$publish)"

  launcher-tests:
    name: Launcher tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 22]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
        working-directory: npm

  build:
    name: Build ${{ matrix.asset }}
    needs: meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: darwin-aarch64
            exe: openspec-ui
            smoke: true
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: darwin-x86_64
            exe: openspec-ui
            smoke: false # cross-compiled on an arm64 runner
          # Linux binaries are static musl builds: they run on Alpine and on any glibc.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: linux-x86_64
            exe: openspec-ui
            smoke: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: linux-aarch64
            exe: openspec-ui
            smoke: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: windows-x86_64
            exe: openspec-ui.exe
            smoke: true

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The frontend is embedded into the binary via rust-embed, so it must be
      # built before cargo runs - otherwise ../frontend/dist is empty and the
      # binary serves nothing.
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-11-11
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: endsWith(matrix.target, '-musl')
        # The runners' apt mirrors fail to resolve now and then; retry before giving up.
        run: |
          for attempt in 1 2 3 4; do
            if sudo apt-get update && sudo apt-get install -y musl-tools; then exit 0; fi
            echo "apt failed (attempt $attempt), retrying in 20 s"
            sleep 20
          done
          exit 1

      - name: Build binary
        working-directory: backend
        run: cargo build --release --target ${{ matrix.target }}

      - name: Smoke test (starts, serves health and the embedded UI)
        if: matrix.smoke
        shell: bash
        env:
          BIN: backend/target/${{ matrix.target }}/release/${{ matrix.exe }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: scripts/smoke-binary.sh "$BIN" "$TAG"

      # .gz (npm launcher, install.sh) and, on unix, the .zip for humans.
      - name: Package .gz and .zip (unix)
        if: runner.os != 'Windows'
        env:
          BIN: backend/target/${{ matrix.target }}/release/${{ matrix.exe }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: scripts/package-release.sh "$BIN" "${{ matrix.asset }}" "$TAG" dist

      - name: Package .gz (windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          BIN: backend/target/${{ matrix.target }}/release/${{ matrix.exe }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: scripts/package-release.sh "$BIN" "${{ matrix.asset }}" "$TAG" dist --no-zip

      - name: Package .zip (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          $stage = "openspec-ui-$env:TAG-${{ matrix.asset }}"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "backend/target/${{ matrix.target }}/release/${{ matrix.exe }}" $stage
          Copy-Item README.md $stage
          if (Test-Path LICENSE) { Copy-Item LICENSE $stage }
          Compress-Archive -Path $stage -DestinationPath "dist/$stage.zip"

      - uses: actions/upload-artifact@v5
        with:
          name: dist-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  assemble:
    name: Assemble release files
    needs: [meta, build, launcher-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v6
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Check completeness, add install.sh, write SHA256SUMS
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        run: scripts/assemble-release.sh dist "$TAG"

      - uses: actions/upload-artifact@v5
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [meta, assemble]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v6
        with:
          name: release-dist
          path: dist

      # No `--clobber`, no fallback upload: a release is created once.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$TAG" dist/* --title "$TAG" --notes-from-tag --verify-tag "${flags[@]}"

  npm-package:
    name: Build npm package
    needs: [meta, assemble]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/download-artifact@v6
        with:
          name: release-dist
          path: dist

      # Checksums come from the very SHA256SUMS that is uploaded to the release.
      - name: Stamp version and checksums, pack
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          node npm/scripts/stamp.js "$VERSION" dist/SHA256SUMS
          (cd npm && npm test)
          mkdir -p out
          (cd npm && npm pack --pack-destination ../out)
          tar -tzf out/*.tgz
          tar -xzOf out/*.tgz package/checksums.json

      - uses: actions/upload-artifact@v5
        with:
          name: npm-tarball
          path: out/*.tgz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # npm publishing is opt-in and skipped (not failed) until the owner enables it:
  #   1. Create the package once: either publish 0.x manually, or add a repo
  #      secret NPM_TOKEN (granular access token, read+write on `openspec-ui`,
  #      bypass 2FA) so this job does the first publish.
  #   2. Add repo variable NPM_PUBLISH=true (Settings > Secrets and variables > Actions > Variables).
  #   3. Optional, recommended afterwards: on npmjs.com > openspec-ui > Settings >
  #      Trusted Publisher > GitHub Actions: owner ToruAI, repo openspec-ui,
  #      workflow release.yml. Then delete NPM_TOKEN; this job falls back to OIDC.
  # Provenance is attached automatically (public repo, public package).
  # ---------------------------------------------------------------------------
  npm-publish:
    name: Publish to npm
    needs: [meta, release, npm-package]
    if: needs.meta.outputs.publish == 'true' && vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24 # npm >= 11.5.1 is required for trusted publishing
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v6
        with:
          name: npm-tarball
          path: out

      - name: Publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.meta.outputs.version }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          if npm view "openspec-ui@${VERSION}" version >/dev/null 2>&1; then
            echo "openspec-ui@${VERSION} is already on npm; nothing to do."
            exit 0
          fi
          if [ -n "${NPM_TOKEN:-}" ]; then export NODE_AUTH_TOKEN="$NPM_TOKEN"; fi
          tag=latest; [ "$PRERELEASE" = true ] && tag=next
          npm publish out/*.tgz --provenance --access public --tag "$tag"

  image:
    name: Container image
    needs: [meta, assemble]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v6
        with:
          name: release-dist
          path: dist

      # The image reuses the tested musl release binaries (no compiling under QEMU).
      - name: Unpack binaries for the build context
        run: scripts/unpack-image-bins.sh dist bins

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build amd64 image and smoke test it
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: prebuilt
          build-contexts: bins=bins
          platforms: linux/amd64
          load: true
          tags: openspec-ui:smoke

      - name: Run the image
        run: scripts/smoke-image.sh openspec-ui:smoke "$PWD/demo" 3000

      - name: Compute tags
        id: tags
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          t="${IMAGE}:${VERSION}"
          if [ "$PRERELEASE" != true ]; then
            t="$t,${IMAGE}:${VERSION%.*},${IMAGE}:latest"
          fi
          echo "list=$t" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        if: needs.meta.outputs.publish == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build multi-arch (push only when publishing)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: prebuilt
          build-contexts: bins=bins
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.meta.outputs.publish == 'true' }}
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
